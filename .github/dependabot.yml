version: 2
updates:
  # The Dockerfile's FROM is the only place the Node version is written (NEU-2016), so docker stands in for
  # the npm/uv entry other repos have: there is no package.json (spec Decision 5).
  - package-ecosystem: docker
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: build
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: updates/dependencies
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    commit-message:
      prefix: ci
    # The shared workflows float on @v1; bumping them is the workflows repo's job.
    ignore:
      - dependency-name: neuroticsasquat-ch/workflows
    groups:
      minor-and-patch:
        update-types: [minor, patch]
