name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Builds the image without pushing, checks it doesn't run as root, runs .github/ci/smoke.sh. No js workflow:
  # there is no package.json (spec Decision 5), so the syntax check and tests run inside the image, in smoke.sh.
  image:
    uses: neuroticsasquat-ch/workflows/.github/workflows/image-check.yml@v1
    with:
      name: obsidian-worklog
      platforms: linux/amd64 # kumadrome (2011 Mac mini) is x86_64

  ci: # the one required check; the name is the contract
    if: always()
    needs: [image] # every other job, extras included
    runs-on: ubuntu-latest
    steps:
      - uses: neuroticsasquat-ch/workflows/actions/gate@v1
        with:
          needs: ${{ toJSON(needs) }}

  # main → latest and sha-<7>, only after ci passed on that commit. Watchtower deploys latest.
  publish:
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci.result == 'success' }}
    needs: ci
    concurrency: { group: "publish-${{ github.ref }}", cancel-in-progress: false }
    permissions: { contents: read, packages: write }
    uses: neuroticsasquat-ch/workflows/.github/workflows/image-publish.yml@v1
    with:
      image: ghcr.io/tomboone/obsidian-worklog
      platforms: linux/amd64
